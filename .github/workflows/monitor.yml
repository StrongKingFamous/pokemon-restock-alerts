name: pokemon-restock-alerts
on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes, GitHub's minimum (it may start a few minutes late)
  workflow_dispatch:            # "Run workflow" button for a manual check
concurrency: monitor            # never two runs at the same time
permissions:
  contents: write               # to save state.json back into the repo
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python news_watch.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: save state
        run: |
          git config user.name "restock-bot"
          git config user.email "restock-bot@users.noreply.github.com"
          git add state.json news_state.json
          git diff --cached --quiet || (git commit -q -m "state" && git push -q)
