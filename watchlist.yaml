# Focus lists: EVERY event for matching products (new incl. pre-orders, back in stock, sold out, price change).
# keywords: all must be in the product title. sealed_only: only sealed products (no single cards / graded slabs).
focus:
  - {name: "30th", keywords: ["30th"], sealed_only: true}

# Price alerts: a 💰 message when a product whose title contains ALL keywords is in stock at or below max_price (euro).
# Examples (remove the # to use them):
watch:
  # - {keywords: ["elite trainer box", "prismatic"], max_price: 60}
  # - {keywords: ["booster box"], max_price: 140}
